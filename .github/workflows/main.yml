name: 茄皇

on:
  schedule:
    - cron: '15 16 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        pip install requests cryptography

    - name: 运行主程序
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
        WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      run: python main.py
